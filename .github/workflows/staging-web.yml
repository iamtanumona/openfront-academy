name: Staging web (Cloudflare Pages)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staging-web
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm content:validate && pnpm typecheck && pnpm test && pnpm build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_SITE_URL: ${{ vars.STAGING_SITE_URL }}
      - name: Publish Astro static output to Cloudflare Pages
        run: pnpm dlx wrangler@3 pages deploy apps/web/dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
